[project]
name = "claude-sessions"
version = "0.1.0"
description = "One list of every Claude Code session on your Mac: open, pin, archive, stop, delete"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ujjwal Vats" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude", "claude-code", "fzf", "sessions", "cli", "terminal", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ujjwalvats-svg/claude-sessions"
Issues = "https://github.com/ujjwalvats-svg/claude-sessions/issues"
Changelog = "https://github.com/ujjwalvats-svg/claude-sessions/blob/main/CHANGELOG.md"

[project.scripts]
cs = "claude_sessions.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "D", "TID"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]
